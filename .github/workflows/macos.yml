name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-tests:
    name: Swift tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Swift unit tests
        run: swift test --parallel
      - name: Secret patterns
        run: |
          if git grep -nEi '(password|authorization|token)[[:space:]]*=[[:space:]]*["'"'][^"'"']+' -- ':!Tests' ':!DEVELOPMENT_PLAN.md'; then
            echo 'Potential committed secret detected' >&2
            exit 1
          fi

  freerdp-arch:
    name: FreeRDP (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: brew install cmake ninja pkg-config openssl@3
      - name: Build native FreeRDP
        run: ./Tools/build-freerdp.sh "${{ matrix.arch }}"
      - name: Package native dependency tree
        run: |
          mkdir -p Artifacts
          tar -C "Vendor/build/${{ matrix.arch }}" -czf "Artifacts/freerdp-${{ matrix.arch }}.tar.gz" install
      - name: Upload native dependency tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freerdp-${{ matrix.arch }}
          path: Artifacts/freerdp-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  app-build:
    name: Universal 2 app
    needs: [domain-tests, freerdp-arch]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download arm64 dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: freerdp-arm64
          path: Artifacts/arm64
      - name: Download x86_64 dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: freerdp-x86_64
          path: Artifacts/x86_64
      - name: Merge Universal 2 dependencies
        run: |
          mkdir -p Vendor/build/arm64 Vendor/build/x86_64
          tar -C Vendor/build/arm64 -xzf Artifacts/arm64/freerdp-arm64.tar.gz
          tar -C Vendor/build/x86_64 -xzf Artifacts/x86_64/freerdp-x86_64.tar.gz
          ./Tools/build-freerdp.sh --merge-only
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build unsigned Universal 2 app
        run: |
          xcodebuild -project RemoteDesktop.xcodeproj -scheme RemoteDesktop \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath "$PWD/DerivedData" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: AppKit and renderer tests
        run: |
          mkdir -p TestResults
          xcodebuild -project RemoteDesktop.xcodeproj -scheme RemoteDesktop \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$PWD/DerivedData" \
            -resultBundlePath "$PWD/TestResults/RemoteDesktopTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test
      - name: Ad-hoc sign and verify Universal 2 app
        run: |
          app="$PWD/DerivedData/Build/Products/Release/RemoteDesktop.app"
          ./Tools/sign-adhoc.sh "$app" "$PWD/Config/RemoteDesktop.entitlements"
          ./Tools/verify-universal.sh "$app" --pre-notarization
      - name: Package test build
        run: |
          mkdir -p Artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Release/RemoteDesktop.app \
            Artifacts/AlstarsRDP-macOS11-Universal2-unsigned.zip
      - name: Upload test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AlstarsRDP-macOS11-Universal2-unsigned
          path: Artifacts/AlstarsRDP-macOS11-Universal2-unsigned.zip
          if-no-files-found: error
          retention-days: 14
      - name: Validate repository
        run: git diff --check
